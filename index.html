<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hectronic Tag Converter v6</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b1020;color:#fff;margin:0}
.wrap{max-width:760px;margin:auto;padding:22px}
.card{background:#151c2f;border:1px solid #2e3b59;border-radius:16px;padding:18px;margin:14px 0}
h1{margin:0 0 4px}.sub{opacity:.7;margin:0 0 18px}
input,button{font:inherit}
input[type=file],input[type=text],input[type=number]{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #44506c;background:#0f1628;color:#fff}
button{width:100%;padding:13px;border:0;border-radius:10px;font-weight:700;background:#eef2ff;color:#111827;margin-top:10px;cursor:pointer}
.out{display:flex;justify-content:space-between;gap:12px;background:#0e1526;padding:10px 12px;border-radius:10px;margin-top:8px}
.val{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-align:right;word-break:break-all}
.small{font-size:13px;opacity:.75;line-height:1.45}.ok{color:#9ae6b4}.err{color:#ffb4b4}.warn{color:#ffd98a}
.highlight{border:1px solid #5571a6;background:#101a31}
#log{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:#090e1a;padding:10px;border-radius:10px;max-height:180px;overflow:auto}
</style>
</head>
<body>
<div class="wrap">
<h1>Hectronic Tag Converter v6</h1>
<p class="sub">Hectronic nummer ↔ EM4100 HEX</p>

<div class="card">
<label><b>1. Hectronic nummer → Flipper EM4100</b></label>
<input id="dec" type="number" inputmode="numeric" placeholder="344649788">
<input id="prefix" type="text" value="A0" maxlength="2" style="margin-top:8px" aria-label="Prefix">
<button id="convertBtn" type="button">Maak EM4100 bytes</button>
<div class="out"><span>Flipper EM4100</span><span id="emout" class="val">—</span></div>
</div>


<div class="card">
<label><b>2. EM4100 HEX → Hectronic nummer</b></label>
<input id="hexin" type="text" inputmode="text" placeholder="A0 14 8A F0 3C">
<button id="hexBtn" type="button">Reken HEX terug</button>
<div class="out highlight"><span><b>Hectronic nummer</b></span><span id="hexnum" class="val"><b>—</b></span></div>
<p class="small">Je mag bijvoorbeeld <b>A0 14 8A F0 3C</b>, <b>A0148AF03C</b> of alleen <b>148AF03C</b> invoeren. Bij 5 bytes wordt de eerste byte als EM4100-prefix behandeld.</p>
</div>

<div class="card"><b>Debuglog</b><div id="log">App gestart.</div></div>
</div>

<script>
(function(){
'use strict';
function el(id){return document.getElementById(id);}
function log(s){el('log').textContent += "\n"+s;el('log').scrollTop=el('log').scrollHeight;}
function status(s,cls){el('status').textContent=s;el('status').className='small '+(cls||'');}
function readU32(dv,o){return dv.getUint32(o,true)}
function readF32(dv,o){return dv.getFloat32(o,true)}
function readVarint(bytes,pos){var value=0,shift=0,p=pos,b;while(p<bytes.length&&shift<35){b=bytes[p++];value+=(b&127)*Math.pow(2,shift);if((b&128)===0)return[value,p];shift+=7}throw new Error('Ongeldige varint op positie '+pos)}
function parseRifl(buf){var bytes=new Uint8Array(buf),dv=new DataView(buf);if(bytes.length<20)throw new Error('Bestand te klein');var magic=String.fromCharCode(bytes[0],bytes[1],bytes[2],bytes[3]);if(magic!=='RIFL')throw new Error('Geen RIFL-bestand; magic='+magic);var version=readU32(dv,4),freq=readF32(dv,8),duty=readF32(dv,12),maxBuf=readU32(dv,16);log('RIFL v'+version+', '+freq+' Hz, duty '+duty+', maxBuf '+maxBuf);var pos=20,pairs=[],block=0;while(pos+4<=bytes.length){var sz=readU32(dv,pos);pos+=4;if(sz===0||sz>maxBuf||pos+sz>bytes.length)break;block++;var end=pos+sz;while(pos<end){var a=readVarint(bytes,pos);pos=a[1];if(pos>=end)break;var b=readVarint(bytes,pos);pos=b[1];pairs.push([a[0],b[0]])}pos=end}log('Blokken: '+block+', pulse/duration-paren: '+pairs.length);return{freq:freq,duty:duty,pairs:pairs}}
function extractFrames(pairs){var frames=[],cur=[];function flush(){if(cur.length>=35&&cur.length<=60)frames.push(cur);cur=[]}for(var i=0;i<pairs.length;i++){var pulse=pairs[i][0],dur=pairs[i][1];if(dur>2000){flush();continue}if(dur>=650&&dur<=850&&pulse>=150&&pulse<=750){cur.push([pulse,dur]);continue}if(dur>1000){flush();continue}}flush();return frames}
function classify(frame){if(frame.length!==45)return null;var ps=frame.map(function(x){return x[0]}).sort(function(a,b){return a-b}),best=-1,idx=-1;for(var i=0;i<ps.length-1;i++){var g=ps[i+1]-ps[i];if(g>best){best=g;idx=i}}if(idx<0||best<80)return null;var th=(ps[idx]+ps[idx+1])/2,bits='';for(i=0;i<frame.length;i++)bits+=frame[i][0]>th?'1':'0';return bits}
function binToHex(bits){var out='';for(var i=0;i<bits.length;i+=4)out+=parseInt(bits.substr(i,4),2).toString(16).toUpperCase();return out}
function spaced(h){return h.match(/.{1,2}/g).join(' ')}
function xorCheck(bits40){var x=0;for(var i=0;i<40;i+=4)x^=parseInt(bits40.substr(i,4),2);var s=x.toString(2);while(s.length<4)s='0'+s;return s}
function decodeImpro(bits40){var map={'00':'0','11':'1','10':'2'},trits='';for(var i=0;i<40;i+=2){var pair=bits40.substr(i,2);if(!map.hasOwnProperty(pair))throw new Error('Onbekend trinary symbool '+pair+' op positie '+(i/2+1));trits+=map[pair]}var main=trits.substr(0,18),suffix=trits.substr(18,2),n=0;for(i=0;i<main.length;i++)n=n*3+Number(main.charAt(i));return{trits:trits,main:main,suffix:suffix,number:n}}
function em4100FromNumber(n,prefix){var h=Math.floor(n).toString(16).toUpperCase();while(h.length<8)h='0'+h;return prefix+' '+h.substr(0,2)+' '+h.substr(2,2)+' '+h.substr(4,2)+' '+h.substr(6,2)}
function analyse(){try{var file=el('file').files&&el('file').files[0];log('Analyseknop ingedrukt.');if(!file){status('Kies eerst een ASK RAW-bestand.','err');return}status('Bezig met lezen: '+file.name+' …','warn');log('Bestand: '+file.name+' ('+file.size+' bytes)');var reader=new FileReader();reader.onerror=function(){status('Bestand kon niet gelezen worden.','err');log('FileReader error')};reader.onload=function(ev){try{var p=parseRifl(ev.target.result),frames=extractFrames(p.pairs);log('Kandidaatframes: '+frames.length);var counts={},total=0;for(var i=0;i<frames.length;i++){var b=classify(frames[i]);if(b){counts[b]=(counts[b]||0)+1;total++}}var bestBits=null,bestCount=0;Object.keys(counts).forEach(function(k){if(counts[k]>bestCount){bestCount=counts[k];bestBits=k}});if(!bestBits)throw new Error('Geen herkenbaar 45-symbolen frame gevonden');var data40=bestBits.substr(0,40),chk=bestBits.substr(40,4),stop=bestBits.substr(44,1),hex=binToHex(data40),last8=hex.substr(2),rawdec=parseInt(last8,16),imp=decodeImpro(data40),em=em4100FromNumber(imp.number,'A0');el('freq').textContent=Math.round(p.freq)+' Hz / '+Math.round(p.duty*100)+'%';el('frames').textContent=bestCount+' identiek / '+total;el('bits').textContent=bestBits;el('raw5').textContent=spaced(hex);el('rawdec').textContent=String(rawdec);el('trits').textContent=imp.trits;el('hecnum').textContent=String(imp.number);el('emauto').textContent=em;el('suffix').textContent=imp.suffix;el('check').textContent=chk+' (verwacht '+xorCheck(data40)+'), stop '+stop;el('dec').value=String(imp.number);el('emout').textContent=em;status('Analyse en Impro legacy-decoding gelukt.','ok');log('RAW: '+spaced(hex));log('Trits: '+imp.trits+' -> Hectronic '+imp.number);log('EM4100: '+em)}catch(e){status('Analysefout: '+e.message,'err');log('FOUT: '+e.stack)}};reader.readAsArrayBuffer(file)}catch(e){status('Fout: '+e.message,'err');log('FOUT buiten analyse: '+e.stack)}}
function hexToHectronic(){var s=el('hexin').value.toUpperCase().replace(/[^0-9A-F]/g,'');if(s.length===10)s=s.substr(2);if(s.length!==8){el('hexnum').textContent='Gebruik 4 of 5 bytes HEX';return}var n=parseInt(s,16);if(!Number.isFinite(n)){el('hexnum').textContent='Ongeldige HEX';return}el('hexnum').textContent=String(n);log('HEX '+s+' -> Hectronic '+n)}
function convert(){var n=Number(el('dec').value),prefix=el('prefix').value.toUpperCase().replace(/[^0-9A-F]/g,'');if(!Number.isInteger(n)||n<0||n>4294967295){el('emout').textContent='Ongeldig nummer';return}if(prefix.length!==2){el('emout').textContent='Prefix moet 2 hextekens zijn';return}el('emout').textContent=em4100FromNumber(n,prefix)}
el('convertBtn').addEventListener('click',convert);el('hexBtn').addEventListener('click',hexToHectronic);log('JavaScript geladen; knoppen gekoppeld.');
})();
</script>
</body>
</html>
